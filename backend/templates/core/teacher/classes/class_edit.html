{% extends "core/base_teacher.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h1 class="h4 mb-4">

                Edit Class

            </h1>

            <form method="post">

                {% csrf_token %}

                {{ form|crispy }}

                <div class="d-flex gap-2 mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        Save Changes

                    </button>

                    <a
                        href="{% url 'teacher_classes' %}"
                        class="btn btn-secondary"
                    >

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
