{% extends "core/base.html" %}

{% block title %}Set New Password - INQ-ED{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Set a new password</h1>
                    {% if validlink %}
                        <form method="post" class="d-grid gap-3">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Update Password</button>
                                <a href="{% url 'login' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    {% else %}
                        <div class="alert alert-danger mb-0">
                            This password reset link is invalid or has expired.
                        </div>
                        <a href="{% url 'password_reset' %}" class="btn btn-primary mt-3">Request a new link</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
