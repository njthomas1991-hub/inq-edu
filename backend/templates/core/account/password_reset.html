{% extends "core/base.html" %}

{% block title %}Reset Password - INQ-ED{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-2">Reset your password</h1>
                    <p class="text-muted mb-4">Enter your email address and we’ll send you a link to create a new password.</p>
                    <form method="post" class="d-grid gap-3">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Send reset link</button>
                            <a href="{% url 'login' %}" class="btn btn-outline-secondary">Back to login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
