<div class="alert alert-{{ type|default:'info' }} {% if dismissible %}alert-dismissible fade show{% endif %}" role="alert">
    {% if icon %}
        <i class="{{ icon }}"></i>
    {% endif %}

    {{ message }}

    {% if dismissible %}
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    {% endif %}
</div>
