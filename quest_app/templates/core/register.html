{% extends 'base.html' %}
{% block content %}
<h2>Register</h2>
<hr>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="mb-3">
    <label for="id_role">Role:</label>
    {{ form.role }}
  </div>
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Register</button>
</form>
<div class="mt-3">
  <p>Already have an account? <a href="/login/">Login here</a>.</p>
</div>
{% endblock %}
