---
name: "Feature Request"
description: "Suggest a new feature or improvement for INQ-ED."
title: "[FEATURE] <short description>"
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Feature Request
        Please describe your idea below to help us improve INQ-ED.

  - type: input
    id: summary
    attributes:
      label: "Short Summary"
      description: "Briefly describe the feature or improvement."
      placeholder: "e.g. Add analytics dashboard for teachers"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Motivation & Context"
      description: "Why is this feature important? What problem does it solve?"
      placeholder: "Teachers need to track student progress across classes."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution"
      description: "Describe your proposed solution or design."
      placeholder: "Add a new dashboard page showing class analytics."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Have you considered any alternative solutions?"
      placeholder: "Manual data export, third-party analytics tools, etc."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Add any other context, screenshots, or references."
      placeholder: "Related issues, links, or images."
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "Confirmation"
      options:
        - label: "I have checked for similar feature requests."
        - label: "This feature is not already implemented."
