---
name: "Bug Report"
description: "Report a bug to help us improve INQ-ED."
title: "[BUG] <short description>"
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Bug Report
        Please fill out the details below to help us resolve your issue quickly.

  - type: input
    id: summary
    attributes:
      label: "Short Summary"
      description: "Briefly describe the bug."
      placeholder: "e.g. Student dashboard crashes on login"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "List the steps to reproduce the bug."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "The dashboard should load without errors."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened? Include error messages if any."
      placeholder: "Error 500: Internal Server Error"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Browser, OS, device, etc."
      placeholder: "Chrome 120, Windows 11, Desktop"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Logs"
      description: "Paste screenshots or logs if available."
      placeholder: "Drag and drop images or paste logs here."
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: "Confirmation"
      options:
        - label: "I have checked for duplicate issues."
        - label: "I am using the latest version of INQ-ED."
        - label: "This bug is not related to a third-party plugin."
